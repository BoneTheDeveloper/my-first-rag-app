[project]
name = "rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luc", email = "catus2k4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-google-genai>=4.3.4",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "langchain-community>=0.4.2",
]

[project.scripts]
rag-app = "rag_app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
